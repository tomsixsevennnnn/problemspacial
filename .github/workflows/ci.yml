name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # generate/build/test ไม่ต้องต่อ DB จริง (test เป็น unit level mock PrismaService ทั้งหมด)
      # แต่ prisma generate อ่าน schema.prisma ซึ่งอ้าง env("DATABASE_URL") ต้องมีค่าตั้งไว้ไม่งั้น CLI error
      DATABASE_URL: postgresql://user:password@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm build
      - run: pnpm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Catering Booking Web Application
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Catering Booking Web Application/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
